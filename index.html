<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0908" />
    <title>Fahrenheit 451: The Fireman's Choice</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0908; overflow: hidden; overscroll-behavior: none; }
      body { touch-action: none; user-select: none; -webkit-user-select: none; }
      #viewport { position: fixed; inset: 0; height: 100%; height: 100dvh; }
      /* Phaser measures the parent's border box, including padding. Inset an
         inner parent instead so safe areas cannot offset or crop the canvas. */
      #game { position: absolute; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      canvas { display: block; touch-action: none; -webkit-touch-callout: none; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #8a7b68;
        font: 14px/1 system-ui, sans-serif; letter-spacing: .3em; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="boot">LOADING</div>
    <div id="viewport"><div id="game"></div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
